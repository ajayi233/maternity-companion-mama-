name: Production Backend Deploy

on:
    workflow_dispatch: # Manual trigger only
    # push:
    #     branches: [main]
    #     paths: ["backend/**"]

permissions:
    id-token: write
    contents: read

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: production

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.PROD_AWS_ROLE_ARN }}
                  role-session-name: GitHubActions-ProdBackend
                  aws-region: eu-west-1

            - name: Login to ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Build and push Docker image
              env:
                  ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                  ECR_REPOSITORY: mama-app-prod-backend
                  IMAGE_TAG: ${{ github.sha }}
              run: |
                  cd backend
                  docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
                  docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
                  docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
                  docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

            - name: Update ECS service
              run: |
                  aws ecs update-service \
                    --cluster mama-app-prod-cluster \
                    --service mama-app-prod-backend \
                    --force-new-deployment
