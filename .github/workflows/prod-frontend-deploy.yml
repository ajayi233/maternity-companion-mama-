name: Production Frontend Deploy

on:
    push:
        branches: [main]
        paths: ["frontend/**"]

permissions:
    id-token: write
    contents: read

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: production

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.PROD_AWS_ROLE_ARN }}
                  role-session-name: GitHubActions-ProdFrontend
                  aws-region: eu-west-1

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "18"
                  cache: "npm"
                  cache-dependency-path: frontend/package-lock.json

            - name: Get config from Parameter Store
              id: config
              run: |
                  echo "app_name=$(aws ssm get-parameter --name '/mama-app/prod/frontend/app-name' --query 'Parameter.Value' --output text)" >> $GITHUB_OUTPUT
                  echo "app_version=$(aws ssm get-parameter --name '/mama-app/prod/frontend/app-version' --query 'Parameter.Value' --output text)" >> $GITHUB_OUTPUT
                  echo "app_description=$(aws ssm get-parameter --name '/mama-app/prod/frontend/app-description' --query 'Parameter.Value' --output text)" >> $GITHUB_OUTPUT
                  echo "api_version=$(aws ssm get-parameter --name '/mama-app/prod/frontend/api-version' --query 'Parameter.Value' --output text)" >> $GITHUB_OUTPUT
                  echo "google_maps_key=$(aws ssm get-parameter --name '/mama-app/prod/frontend/google-maps-api-key' --with-decryption --query 'Parameter.Value' --output text)" >> $GITHUB_OUTPUT

            - name: Install dependencies
              run: |
                  cd frontend
                  npm ci

            - name: Build application
              env:
                  VITE_APP_NAME: ${{ steps.config.outputs.app_name }}
                  VITE_APP_VERSION: ${{ steps.config.outputs.app_version }}
                  VITE_APP_DESCRIPTION: ${{ steps.config.outputs.app_description }}
                  VITE_API_BASE_URL: https://api.auto-hive.site/api
                  VITE_API_VERSION: ${{ steps.config.outputs.api_version }}
                  VITE_GOOGLE_MAPS_API_KEY: ${{ steps.config.outputs.google_maps_key }}
                  VITE_GHANA_NLP_API_BASE_URL: ${{ secrets.VITE_GHANA_NLP_API_BASE_URL }}
                  VITE_GHANA_NLP_SUBSCRIPTION_KEY: ${{ secrets.VITE_GHANA_NLP_SUBSCRIPTION_KEY }}
                  NODE_ENV: production
              run: |
                  cd frontend
                  npm run build

            - name: Deploy to S3
              run: |
                  aws s3 sync ./frontend/dist s3://${{ secrets.PROD_S3_BUCKET_NAME }} --delete

            - name: Invalidate CloudFront
              run: |
                  aws cloudfront create-invalidation \
                    --distribution-id ${{ secrets.PROD_CLOUDFRONT_DISTRIBUTION_ID }} \
                    --paths "/*"
