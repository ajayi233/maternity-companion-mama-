name: Backend Deploy Dev

on:
  push:
    branches: [dev]
    paths: ["backend/**"]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-Backend
          aws-region: eu-west-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: mama-app-dev-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd backend
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to EC2 using AWS Systems Manager
        run: |
          # Send commands to EC2 instance using AWS Systems Manager
          aws ssm send-command \
            --instance-ids i-032e87fe13fe06c69 \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /opt/mama-app",
              "aws ecr get-login-password --region eu-west-1 | docker login --username AWS --password-stdin 615299752577.dkr.ecr.eu-west-1.amazonaws.com",
              "docker pull 615299752577.dkr.ecr.eu-west-1.amazonaws.com/mama-app-dev-backend:latest",
              "docker-compose down",
              "docker-compose up -d",
              "docker-compose ps"
            ]' \
            --region eu-west-1 \
            --output text --query 'Command.CommandId'
