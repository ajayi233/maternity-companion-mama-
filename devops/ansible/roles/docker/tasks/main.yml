---
# Docker Installation and Configuration
- name: Add Docker GPG key
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present
  tags: [docker, install]

- name: Add Docker repository
  apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
  tags: [docker, install]

- name: Update apt cache
  apt:
    update_cache: yes
  tags: [docker, install]

- name: Install Docker packages
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  tags: [docker, install]

- name: Start and enable Docker service
  systemd:
    name: docker
    state: started
    enabled: yes
  tags: [docker, service]

- name: Add ubuntu user to docker group
  user:
    name: ubuntu
    groups: docker
    append: yes
  tags: [docker, users]

- name: Install Docker Compose (standalone)
  get_url:
    url: "https://github.com/docker/compose/releases/download/v{{ docker_compose_version }}/docker-compose-{{ ansible_system }}-{{ ansible_architecture }}"
    dest: /usr/local/bin/docker-compose
    mode: "0755"
  tags: [docker, compose]

- name: Create docker-compose symlink
  file:
    src: /usr/local/bin/docker-compose
    dest: /usr/bin/docker-compose
    state: link
  tags: [docker, compose]

- name: Verify Docker installation
  command: docker --version
  register: docker_version
  changed_when: false
  tags: [docker, verify]

- name: Verify Docker Compose installation
  command: docker-compose --version
  register: compose_version
  changed_when: false
  tags: [docker, verify]

- name: Display Docker version information
  debug:
    msg:
      - "Docker Version: {{ docker_version.stdout }}"
      - "Docker Compose Version: {{ compose_version.stdout }}"
  tags: [docker, verify]
