# =============================================================================
# Ansible Configuration for MAMA App
# This file configures Ansible behavior for infrastructure management
# =============================================================================

[defaults]
# Core Ansible Settings
# ---------------------

# Inventory file location - tells Ansible where to find server definitions
inventory = inventory/hosts.yml

# Roles path - tells Ansible where to find custom roles
roles_path = roles

# Skip SSH host key verification (useful for dynamic EC2 instances)
# WARNING: Only use in trusted environments like your own AWS infrastructure
host_key_checking = False

# Connection timeout in seconds (how long to wait for SSH connections)
timeout = 30

# Fact gathering strategy: 'smart' = gather facts only when needed
# Reduces playbook execution time by avoiding unnecessary fact collection
gathering = smart

# Cache facts in memory during playbook execution
# Improves performance when running multiple plays against same hosts
fact_caching = memory

# Output format for playbook results
# 'yaml' provides clean, readable output with proper formatting
stdout_callback = yaml

# Enable binary callbacks (for better output formatting)
bin_ansible_callbacks = True

# =============================================================================
# SSH Connection Optimization
# These settings improve SSH connection performance and reliability
# =============================================================================

[ssh_connection]
# SSH connection reuse settings for faster execution:
# - ControlMaster=auto: Reuse existing SSH connections when possible
# - ControlPersist=60s: Keep connections alive for 60 seconds after last use
# - UserKnownHostsFile=/dev/null: Don't save host keys (for dynamic instances)
# - StrictHostKeyChecking=no: Skip host key verification (trusted environment)
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no

# Enable SSH pipelining - reduces SSH round trips for better performance
pipelining = True

# Path template for SSH control sockets
# %%h = hostname, %%p = port, %%r = username
control_path = /tmp/ansible-ssh-%%h-%%p-%%r

# =============================================================================
# Logging Configuration
# Centralized logging for debugging and audit trails
# =============================================================================

[logging]
# Path where Ansible will save execution logs
# Useful for troubleshooting failed playbooks and debugging issues
log_path = /tmp/ansible.log
