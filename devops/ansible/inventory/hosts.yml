---
# =============================================================================
# Ansible Inventory for MAMA App Infrastructure
# This file defines servers and variables for Ansible to manage
# =============================================================================

all:
  # Global variables applied to all hosts
  vars:
    # Application configuration
    app_name: mama-app
    app_environment: dev
    app_domain: api.auto-hive.site
    app_email: admin@auto-hive.site

    # AWS Configuration
    aws_region: eu-west-1
    ecr_registry: "615299752577.dkr.ecr.eu-west-1.amazonaws.com"
    ecr_repository: "mama-app-dev-backend"
    aws_account_id: "615299752577"

    # Docker configuration
    docker_compose_version: "2.21.0"
    app_directory: "/opt/mama-app"

    # SSL configuration
    ssl_enabled: true
    certbot_email: "admin@auto-hive.site"

    # Nginx configuration
    nginx_worker_processes: 1
    nginx_worker_connections: 1024
    nginx_rate_limit: "10r/s"
    nginx_burst: 20

  # Server groups and hosts
  children:
    # Backend server group
    mama_backend:
      hosts:
        api.auto-hive.site:
          # Connection details
          ansible_host: "{{ lookup('env', 'EC2_ELASTIC_IP') }}"
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/mama-app-key.pem
          ansible_ssh_common_args: "-o StrictHostKeyChecking=no"

          # Server-specific variables
          ec2_instance_id: "{{ lookup('env', 'EC2_INSTANCE_ID') }}"
          project_name: mama-app
          app_environment_name: dev

 
